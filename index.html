<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDILSA – Redes Sociales</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Montserrat',sans-serif;
  background:#ffffff;
  color:#0a1a2f;
  overflow-x:hidden;
}

/* ===== PARTICULAS ===== */
#particles{
  position:fixed;
  inset:0;
  z-index:-1;
}

/* ===== HEADER ===== */
header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(0,0,0,.05);
  padding:14px 22px;
  display:flex;
  justify-content:center;
}

.logo{
  display:flex;
  align-items:center;
  gap:14px;
  text-decoration:none;
}

.logo img{
  height:42px;
}

.logo span{
  color:#0a66c2;
  font-weight:800;
  font-size:1.3rem;
}

/* ===== CONTENIDO ===== */
.container{
  padding:90px 20px 70px;
  text-align:center;
}

.container h1{
  font-size:2.2rem;
  font-weight:800;
  color:#0a66c2;
  margin-bottom:12px;
}

.container p{
  color:#5c6f87;
  max-width:440px;
  margin:0 auto 44px;
  line-height:1.6;
}

/* ===== BOTONES ===== */
.social-box{
  display:flex;
  flex-direction:column;
  gap:18px;
  max-width:360px;
  margin:auto;
}

.btn-social{
  padding:17px;
  border-radius:16px;
  font-weight:700;
  font-size:.95rem;
  text-decoration:none;
  color:#0a1a2f;
  background:#ffffff;
  border:1px solid rgba(0,0,0,.08);
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  transition:all .25s ease;
}

.btn-social:hover{
  transform:translateY(-4px);
  box-shadow:0 18px 40px rgba(0,0,0,.12);
}

/* ===== COLORES REDES ===== */
.youtube{border-left:4px solid #ff0000}
.instagram{border-left:4px solid #e1306c}
.facebook{border-left:4px solid #1877f2}
.x{border-left:4px solid #000}
.whatsapp{border-left:4px solid #25d366}
.linkedin{
  border-left:4px solid #0a66c2;
  background:linear-gradient(90deg, rgba(10,102,194,.08), transparent);
}

/* ===== FOOTER ===== */
footer{
  margin-top:70px;
  text-align:center;
  color:#7b8da6;
  font-size:.85rem;
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<header>
  <a href="#" class="logo">
    <img src="https://i.ibb.co/hRmLJ1QP/Whats-App-Image-2025-12-09-at-11-26-34-PM.jpg" alt="IDILSA">
    <span>IDILSA</span>
  </a>
</header>

<section class="container">
  <h1>Redes Sociales Oficiales</h1>
  <p>Síguenos y conoce más sobre nuestros proyectos, soluciones industriales y experiencia en lubricación.</p>

  <div class="social-box">
    <a class="btn-social youtube" href="https://www.youtube.com/user/IDILSA" target="_blank">YouTube</a>
    <a class="btn-social instagram" href="https://www.instagram.com/idilsa1998/" target="_blank">Instagram</a>
    <a class="btn-social facebook" href="https://es-la.facebook.com/idilsa.ingenieriadisenolubricacion" target="_blank">Facebook</a>
    <a class="btn-social x" href="https://x.com/idilsa" target="_blank">X</a>
    <a class="btn-social whatsapp" href="https://api.whatsapp.com/send?phone=525546106384" target="_blank">WhatsApp</a>
    <a class="btn-social linkedin" href="https://mx.linkedin.com/company/idilsa" target="_blank">LinkedIn</a>
  </div>
</section>

<footer>
  © 2026 IDILSA — Ingeniería & Diseño en Lubricación
</footer>

<script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];
const num = 90;

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

for(let i=0;i<num;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2.5+1,
    dx:(Math.random()-0.5)*0.4,
    dy:(Math.random()-0.5)*0.4
  });
}

function drawConnections(){
  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){
      let dx = particles[i].x - particles[j].x;
      let dy = particles[i].y - particles[j].y;
      let dist = Math.sqrt(dx*dx + dy*dy);

      if(dist < 120){
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = "rgba(10,102,194,"+(1 - dist/120)*0.25+")";
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    p.x+=p.dx;
    p.y+=p.dy;

    if(p.x<0||p.x>canvas.width) p.dx*=-1;
    if(p.y<0||p.y>canvas.height) p.dy*=-1;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle="rgba(10,102,194,0.5)";
    ctx.fill();
  });

  drawConnections();
  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
